name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    # Match the OS supported by the pinned Playwright browser/dependency bundle.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Saved policy project acceptance
        run: |
          cargo build --locked
          target/debug/wisp project describe examples/policies/project.json > project-interface.json
          target/debug/wisp project verify examples/policies/project.json > project-verify.json
          target/debug/wisp project review examples/policies/project-before.json examples/policies/project.json > project-review.json
          python3 examples/policies/decisions.py > project-decisions.jsonl
          target/debug/wisp project verify examples/order-gate/project.json > order-gate-verify.json
          python3 -B examples/order-gate/run.py > order-gate-plan.json
          python3 -B examples/order-gate/run.py --baseline examples/order-gate/project-before.json > order-gate-review.json
          python3 -B examples/order-gate/run.py --baseline examples/order-gate/project-before.json --expect examples/order-gate/observed.expect.json > order-gate-gated.json
          if python3 -B examples/order-gate/run.py --baseline examples/order-gate/project-before.json --orders examples/order-gate/bulk-orders.json --expect examples/order-gate/proposed-free-shipping.expect.json > order-gate-proposal.json; then
            echo "Proposed requirements unexpectedly passed"
            exit 1
          else
            exit_code=$?
            test "$exit_code" -eq 1
          fi
          python3 -c 'import json; r=json.load(open("order-gate-proposal.json")); assert r["status"] == "Fail" and r["expectation"]["summary"]["fail"] == 2'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-project-evidence
          path: |
            project-*.json
            project-*.jsonl
            order-gate-*.json
          if-no-files-found: ignore
      - run: cargo install wasm-pack --locked --version 0.15.1
      - run: npm ci
      - run: npm run wasm
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-artifacts
          path: |
            test-results/
            playwright-report/
