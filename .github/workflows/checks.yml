name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    # Match the OS supported by the pinned Playwright browser/dependency bundle.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Saved policy project acceptance
        run: |
          cargo build --locked
          target/debug/wisp project describe examples/policies/project.json > project-interface.json
          target/debug/wisp project verify examples/policies/project.json > project-verify.json
          target/debug/wisp project review examples/policies/project-before.json examples/policies/project.json > project-review.json
          python3 -B examples/policies/propose.py --project examples/policies/project-before.json --policy reservations --function decide --expected-guard-file examples/policies/maintenance.guard.json --replacement-file examples/policies/maintenance.body.txt > project-proposal.json
          python3 -c 'import json; r=json.load(open("project-proposal.json")); s=r["review"]["report"]["review"]["summary"]; assert r["status"] == "Pass" and r["approval"] == "not_granted" and r["applied"] is False and r["context"]["status"] == r["preparation"]["status"] == "Ready" and r["review"]["status"] == "Pass" and s["expectation_pass"] == 7 and s["changed"] == 2 and s["attempted_invocations"] == 14'
          python3 examples/policies/decisions.py > project-decisions.jsonl
          target/debug/wisp project verify examples/order-gate/project.json > order-gate-verify.json
          python3 -B examples/order-gate/run.py > order-gate-plan.json
          python3 -B examples/order-gate/run.py --baseline examples/order-gate/project-before.json > order-gate-review.json
          python3 -B examples/order-gate/run.py --baseline examples/order-gate/project-before.json --expect examples/order-gate/observed.expect.json > order-gate-gated.json
          if python3 -B examples/order-gate/run.py --baseline examples/order-gate/project-before.json --orders examples/order-gate/bulk-orders.json --expect examples/order-gate/proposed-free-shipping.expect.json > order-gate-proposal.json; then
            echo "Proposed requirements unexpectedly passed"
            exit 1
          else
            exit_code=$?
            test "$exit_code" -eq 1
          fi
          python3 -c 'import json; r=json.load(open("order-gate-proposal.json")); assert r["status"] == "Fail" and r["expectation"]["summary"]["fail"] == 2'
          target/debug/wisp project verify examples/release-triage/project.json > release-triage-verify.json
          python3 -B examples/release-triage/run.py --evidence examples/release-triage/pr16-merge.json > release-triage-observed.json
          python3 -c 'import json; r=json.load(open("release-triage-observed.json")); assert r["status"] == "Complete" and r["decision"] == {"state":"Observed","reason":"workflow_checks_complete"} and r["approval"] == "not_granted"'
          python3 -B examples/release-triage/observe.py --evidence examples/release-triage/pr16-merge.json > release-triage-receipt.json
          python3 -c 'import json,hashlib; r=json.load(open("release-triage-receipt.json")); c=r["collection"]; assert c["snapshot_hash"] == hashlib.sha256(c["snapshot_json"].encode("utf-8")).hexdigest() == r["triage"]["evidence_hash"]; assert r["triage"]["decision"]["state"] == "Observed" and c["api_get_invocations"] == 0'
          python3 -B examples/release-triage/replay.py --receipt release-triage-receipt.json > release-triage-replay.json
          python3 -c 'import json; r=json.load(open("release-triage-replay.json")); assert r["comparison"] == "Reproduced" and r["status"] == "Observed" and r["new_execution"] is True and r["approval"] == "not_granted"'
      - name: Official MCP SDK interoperability
        timeout-minutes: 5
        run: |
          python3 -m venv .venv-mcp-sdk
          .venv-mcp-sdk/bin/python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r integrations/mcp/requirements-test.txt
          .venv-mcp-sdk/bin/python -m pip check
          .venv-mcp-sdk/bin/python -m pip freeze > mcp-sdk-packages.txt
          .venv-mcp-sdk/bin/python -B scripts/mcp_sdk_smoke.py > mcp-sdk-source.json
          .venv-mcp-sdk/bin/python -B scripts/mcp_sdk_smoke.py --project examples/policies/project.json > mcp-sdk-project.json
          .venv-mcp-sdk/bin/python -B scripts/mcp_sdk_smoke.py --project examples/policies/project.json --require-project-guard > mcp-sdk-strict.json
          .venv-mcp-sdk/bin/python -B scripts/mcp_sdk_failures.py > mcp-sdk-failures.json
          .venv-mcp-sdk/bin/python -B scripts/mcp_internal_triage.py --budget 2048 > mcp-sdk-internal-triage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-project-evidence
          path: |
            project-*.json
            project-*.jsonl
            order-gate-*.json
            release-triage-*.json
            mcp-sdk-*.json
            mcp-sdk-packages.txt
          if-no-files-found: ignore
      - run: cargo install wasm-pack --locked --version 0.15.1
      - run: npm ci
      - run: npm run wasm
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-artifacts
          path: |
            test-results/
            playwright-report/
